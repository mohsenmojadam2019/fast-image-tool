<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Image Tool</title><link rel="stylesheet" href="popup.css"></head><body><main><header><div><h1>Fast Image Tool</h1><p>ویرایش سریع، خصوصی و آفلاین</p></div><span class="badge">LOCAL</span></header><label class="drop" id="drop"><input id="files" type="file" accept="image/*" multiple><b>تصویرها را اینجا بکشید</b><small>یا کلیک کنید · چندتایی هم‌زمان</small></label><section id="work" hidden><div id="list"></div><div class="toolbar"><label>فرمت<select id="format"><option value="image/webp">WebP</option><option value="image/avif">AVIF</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></label><label>کیفیت <output id="qv">۸۵٪</output><input id="quality" type="range" min="40" max="100" value="85"></label><label>حداکثر حجم (KB)<input id="target" type="number" min="0" placeholder="اختیاری"></label></div><div class="presets"><button data-r="1">آزاد</button><button data-r="1">۱:۱</button><button data-r="1.333">۴:۳</button><button data-r="1.778">۱۶:۹</button><button data-r="0.8">۴:۵</button><button data-r="0.5625">۹:۱۶</button></div><div class="actions"><button id="export">پردازش و دانلود همه</button><button id="clear" class="secondary">پاک‌کردن</button></div><p id="status"></p></section></main><script src="popup.js"></script></body></html>
